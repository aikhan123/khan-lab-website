<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF | Khan Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;color:#17212b;font:15px system-ui}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:white;box-shadow:0 1px 5px #0002}button,a,select{font:inherit}button,select{padding:7px;border:1px solid #bbc2ca;border-radius:5px;background:white}button:disabled{opacity:.45}a{color:#075985}#title{flex:1;overflow-wrap:anywhere}main{padding:20px;overflow:auto;text-align:center}canvas{display:block;margin:auto;background:white;box-shadow:0 2px 12px #0003}#status{margin:8px}
</style></head><body><header><a href="publications.html">Publications</a><strong id="title">PDF</strong><button id="prev" disabled>Previous</button><span id="page">Loading</span><button id="next" disabled>Next</button><label>Zoom <select id="zoom"><option value="fit">Fit width</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><a id="download" download>Download PDF</a></header><p id="status" role="status">Loading PDF…</p><main><canvas id="canvas" aria-label="PDF page"></canvas></main>
<script type="module">
import * as pdfjs from './vendor/pdfjs/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='./vendor/pdfjs/pdf.worker.mjs';
const $=id=>document.getElementById(id);let doc,num=1,busy=false;
async function render(){if(busy||!doc)return;busy=true;$('prev').disabled=$('next').disabled=$('zoom').disabled=true;
try{const page=await doc.getPage(num);const base=page.getViewport({scale:1});const scale=$('zoom').value==='fit'?Math.min(1.7,Math.max(.25,(innerWidth-48)/base.width)):Number($('zoom').value);const vp=page.getViewport({scale});const c=$('canvas'),ratio=Math.min(devicePixelRatio||1,2);c.width=Math.floor(vp.width*ratio);c.height=Math.floor(vp.height*ratio);c.style.width=vp.width+'px';c.style.height=vp.height+'px';await page.render({canvasContext:c.getContext('2d'),viewport:vp,transform:[ratio,0,0,ratio,0,0]}).promise;c.setAttribute('aria-label','PDF page '+num+' of '+doc.numPages);$('page').textContent=num+' / '+doc.numPages;$('status').textContent='';}catch(e){$('status').textContent='Could not render this page: '+e.message;}finally{busy=false;$('prev').disabled=num<=1;$('next').disabled=num>=doc.numPages;$('zoom').disabled=false;}}
$('prev').onclick=()=>{if(num>1&&!busy){num--;render();}};$('next').onclick=()=>{if(doc&&num<doc.numPages&&!busy){num++;render();}};$('zoom').onchange=render;
try{const file=new URLSearchParams(location.search).get('file');if(!file)throw Error('No PDF selected. Return to Publications and choose a PDF.');const url=new URL(file,location.href);if(url.origin!==location.origin||!url.pathname.toLowerCase().endsWith('.pdf'))throw Error('Please select a PDF hosted on this website.');$('title').textContent=decodeURIComponent(url.pathname.split('/').pop());document.title=$('title').textContent+' | Khan Lab';$('download').href=url.href;doc=await pdfjs.getDocument({url:url.href,cMapUrl:'./vendor/pdfjs/cmaps/',cMapPacked:true,standardFontDataUrl:'./vendor/pdfjs/standard_fonts/',wasmUrl:'./vendor/pdfjs/wasm/'}).promise;await render();}catch(e){$('status').textContent='Unable to load PDF: '+e.message;}
</script></body></html>
